  return SUPABASE_BASE + "/" + path.split("/").map(encodeURIComponent).join("/");
}

// mediaUrl("audio", "0 mort.mp3") -> lien direct Supabase

  <script>
    const TIMEOUT = 10000;
    const rows = document.getElementById('rows');
    let total = 0, done = 0, failed = [];

    function check(kind, url) {
      return new Promise((resolve) => {
        let el;
        const finish = (ok) => { clearTimeout(t); resolve(ok); };
        const t = setTimeout(() => finish(false), TIMEOUT);
        if (kind === 'images') {
          el = new Image();
          el.onload = () => finish(true);
          el.onerror = () => finish(false);
        } else {
          el = document.createElement(kind === 'audio' ? 'audio' : 'video');
          el.preload = 'metadata';
          el.onloadedmetadata = () => finish(true);
          el.onerror = () => finish(false);
        }
        el.src = url;
      });
    }

    async function run() {
      const jobs = [];
      for (const kind of Object.keys(ASSETS)) {
        for (const [name, url] of Object.entries(ASSETS[kind])) {
          total++;
          const tr = document.createElement('tr');
          tr.innerHTML = `<td class="wait">⏳ ${kind}</td><td></td>`;
          tr.children[1].innerHTML = `${name}<br><a href="${url}" target="_blank" rel="noopener">${url}</a>`;
          rows.appendChild(tr);
          jobs.push(check(kind, url).then((ok) => {
            done++;
            tr.children[0].className = ok ? 'ok' : 'ko';
            tr.children[0].textContent = (ok ? '✅ ' : '❌ ') + kind;
            if (!ok) failed.push(`${kind}/${name}`);
          }));
        }
      }
      await Promise.all(jobs);
      const s = document.getElementById('summary');
      if (failed.length === 0) {
        s.innerHTML = `✅ Les ${total} fichiers sont accessibles.`;
      } else if (failed.length === total) {
        s.innerHTML = `❌ <strong>Aucun fichier accessible.</strong> Le bucket « assets » n'est probablement pas public (Supabase → Storage → assets → ⋮ → Edit bucket → cocher « Public bucket »), ou l'adresse du projet est incorrecte.`;
      } else {
        s.innerHTML = `⚠️ ${total - failed.length}/${total} accessibles. Fichiers manquants ou mal nommés (${failed.length}) : <br>` +
          failed.map((f) => `• ${f}`).join('<br>') +
          `<br><br>Uploadez-les dans le bon dossier, ou corrigez le nom dans le bloc ASSETS de <code>script.js</code> et <code>player.js</code>.`;
      }
    }
    // Police des noms : le fichier .ttf est un secours (la police est aussi intégrée dans style.css)
    async function checkFont() {
      const tr = document.createElement('tr');
      let ok = false;
      try {
        const ff = new FontFace('AngelWishFichier', "url('Angel_wish.ttf')");
        await ff.load();
        ok = true;
      } catch (e) { ok = false; }
      tr.innerHTML = `<td class="${ok ? 'ok' : 'wait'}">${ok ? '✅' : 'ℹ️'} police</td><td>Angel_wish.ttf (secours)<br>` +
        (ok ? 'Fichier présent à la racine du site.' : "Fichier absent ou illisible : sans conséquence, la police est intégrée dans <code>style.css</code>.") + '</td>';
      document.getElementById('rows').appendChild(tr);
    }
    checkFont();
    run();
  </script>
